[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svf-kiosk"
version = "2.0.0"
description = "Sistema multimediale SVF Kiosk per un museo ferroviario"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.85.0",
    "pydantic>=2.10.0",
    "python-mpv-jsonipc>=1.1.1",
    "evdev>=1.7.0; sys_platform == 'linux'",
    "pytest>=8.3.0",
]

[project.scripts]
svf-ingest = "src.cli.ingest:main"
svf-usb-sync = "src.cli.usb_sync:main"
svf-playlist-editor = "src.tui.playlist_editor:main"
svf-kiosk-daemon = "src.daemon.kiosk_player:main"
svf-presets = "src.cli.presets:main"
svf-status = "src.cli.status:main"
svf-restore = "src.cli.restore:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.db" = ["schema.sql"]
