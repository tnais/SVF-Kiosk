# CI per SVF-Kiosk (Python 3.11+).
# Installa il progetto, esegue i test e crea un wheel a ogni push o pull request
# verso master.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:        # pulsante "Run workflow" nella scheda Actions

# Il GITHUB_TOKEN del run può solo leggere il codice: alla CI non serve altro.
permissions:
  contents: read

# Un push nuovo sulla stessa branch annulla il run vecchio ancora in corso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test e build Python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installa progetto e strumenti di build
        run: python -m pip install --editable . build
      - name: Esegui i test
        run: python -m pytest tests/
      - name: Crea il pacchetto wheel
        run: python -m build --wheel
      - name: Wheel come artifact
        uses: actions/upload-artifact@v7
        with:
          name: svf-kiosk-python-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
